<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#050505">
    <title>MECH.CALENDAR // SYSTEM V.2</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /*
         * DESIGN SYSTEM: INDUSTRIAL / UTILITARIAN V.2
         * Focus: Precision, Contrast, Technicality, Mobile Parity
         */
        :root {
            --bg-color: #050505;
            --bg-surface: #101010;
            --bg-panel: #181818;
            --bg-elevated: #202020;
            --border-color: #444444;
            --border-bright: #666666;
            --accent-color: #ff3b30;
            --accent-dim: rgba(255, 59, 48, 0.2);
            --accent-glow: rgba(255, 59, 48, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #555555;
            --grid-line: rgba(255, 255, 255, 0.08);
            --safe-bottom: env(safe-area-inset-bottom, 0px);

            /* Category Colors */
            --cat-default: #ff3b30;
            --cat-work: #007aff;
            --cat-personal: #34c759;
            --cat-urgent: #ff9500;
            --cat-social: #af52de;
            --cat-health: #ff2d55;
            --cat-finance: #5ac8fa;

            /* Dynamic Typography */
            --font-display: 'Oswald', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --fs-brand: clamp(1.5rem, 4vw, 2.5rem);
            --fs-month: clamp(1.3rem, 3.5vw, 2rem);
            --fs-heading: clamp(1.2rem, 3vw, 2rem);
            --fs-body: clamp(0.7rem, 1.8vw, 0.9rem);
            --fs-day-num: clamp(1rem, 2.5vw, 1.4rem);

            /* Layout */
            --sidebar-w: clamp(280px, 28vw, 380px);
            --header-h: auto;
            --touch-min: 44px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Kill 300ms tap delay / double-tap zoom on controls;
           scrollable areas keep their own touch-action rules. */
        button, .cat-option { touch-action: manipulation; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: var(--fs-body);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
            cursor: crosshair;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            display: grid;
            grid-template-rows: auto 1fr;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        header {
            padding: clamp(8px, 2vw, 20px) clamp(15px, 3vw, 40px);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 100;
        }

        .brand {
            font-family: var(--font-display);
            font-size: var(--fs-brand);
            text-transform: uppercase;
            letter-spacing: 3px;
            border-left: 4px solid var(--accent-color);
            padding-left: 12px;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: clamp(5px, 1.5vw, 20px);
            order: 3;
            width: 100%;
            justify-content: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sys-info {
            text-align: right;
            font-size: 0.6rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: none;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: clamp(5px, 1.5vw, 20px);
        }

        #currentMonthDisplay {
            font-family: var(--font-display);
            font-size: var(--fs-month);
            color: var(--accent-color);
            text-transform: uppercase;
            min-width: clamp(120px, 22vw, 250px);
            text-align: center;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .icon-btn {
            background: #000;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            min-width: var(--touch-min);
            min-height: var(--touch-min);
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
        }

        .icon-btn:hover, .icon-btn:active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .icon-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .icon-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== MAIN ===== */
        main {
            display: grid;
            grid-template-columns: 1fr var(--sidebar-w);
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* ===== CALENDAR VIEW ===== */
        .calendar-area {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #000;
        }

        .view-toolbar {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            min-height: var(--touch-min);
        }

        .view-toggle {
            display: flex;
            gap: 0;
        }

        .view-toggle .icon-btn {
            border-radius: 0;
            min-height: 32px;
            min-width: 50px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .view-toggle .icon-btn:not(:last-child) {
            border-right: none;
        }

        .cat-filter {
            display: flex;
            gap: 4px;
            align-items: center;
            margin-left: auto;
            flex-wrap: wrap;
        }

        .cat-chip {
            padding: 4px 8px;
            font-size: 0.6rem;
            border: 1px solid var(--border-color);
            background: #000;
            color: var(--text-secondary);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s;
            min-height: 28px;
            display: flex;
            align-items: center;
            gap: 4px;
            border-radius: 0;
        }

        .cat-chip .dot {
            width: 8px;
            height: 8px;
            border-radius: 0;
            display: inline-block;
        }

        .cat-chip.active {
            color: var(--text-primary);
            border-color: var(--border-bright);
            background: var(--bg-elevated);
        }

        .calendar-view {
            flex: 1;
            padding: clamp(5px, 1.5vw, 20px);
            display: grid;
            overflow: auto;
            touch-action: pan-y;
            overscroll-behavior-y: contain;
        }

        .calendar-view.month-view {
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto repeat(6, minmax(60px, 1fr));
        }

        .calendar-view.week-view {
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto 1fr;
        }

        .day-header {
            position: sticky;
            top: 0;
            z-index: 6;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            padding: clamp(4px, 1vw, 15px) 0;
            font-size: clamp(0.6rem, 1.5vw, 1rem);
            color: var(--text-primary);
            background: #222;
            border: 1px solid var(--border-color);
            letter-spacing: 2px;
        }

        .day-cell {
            background: var(--bg-panel);
            min-height: 50px;
            padding: clamp(3px, 0.8vw, 10px);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 3px;
            transition: background 0.15s, border-color 0.15s;
            overflow: hidden;
            position: relative;
        }

        .day-cell.empty {
            background: #080808;
        }

        .day-cell:hover {
            background: #2a2a2a;
        }

        .day-cell.today {
            background: #1a0000;
            border-color: var(--accent-color);
        }

        .day-cell.selected {
            border: 2px solid var(--accent-color);
            box-shadow: inset 0 0 10px rgba(255, 59, 48, 0.2);
            z-index: 5;
        }

        .week-view .day-cell {
            min-height: 0;
            height: 100%;
            overflow-y: auto;
        }

        .day-number {
            font-weight: 700;
            font-size: var(--fs-day-num);
            color: var(--text-primary);
            min-width: clamp(24px, 3vw, 35px);
            min-height: clamp(24px, 3vw, 35px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border: 1px solid #333;
            flex-shrink: 0;
        }

        .today .day-number {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .event-marker {
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            background: #000;
            border-left: 3px solid var(--cat-default, #ff3b30);
            padding: 3px 6px;
            color: #ddd;
            margin-bottom: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .event-marker:hover {
            background: #1a1a1a;
        }

        .event-marker .event-time {
            font-size: 0.9em;
            opacity: 0.7;
            font-weight: 700;
        }

        .event-marker .event-more {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: var(--bg-surface);
            padding: clamp(15px, 2.5vw, 30px);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar h2 {
            font-family: var(--font-display);
            text-transform: uppercase;
            margin-bottom: 15px;
            font-size: var(--fs-heading);
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 5px;
            width: fit-content;
        }

        .selected-date {
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .event-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        .event-list::-webkit-scrollbar {
            width: 4px;
        }

        .event-list::-webkit-scrollbar-track {
            background: #000;
        }

        .event-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
        }

        .event-card {
            background: #111;
            border: 1px solid #333;
            border-left: 4px solid var(--cat-color, var(--cat-default));
            padding: clamp(10px, 2vw, 15px);
            margin-bottom: 8px;
            transition: border-color 0.15s;
        }

        .event-card:hover {
            border-color: var(--border-bright);
        }

        .event-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 8px;
        }

        .event-card-title {
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
            flex: 1;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
        }

        .event-card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .event-card-cat {
            padding: 2px 6px;
            background: var(--cat-color, var(--cat-default));
            color: #fff;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.6rem;
        }

        .event-card-time {
            font-weight: 700;
        }

        .event-card-desc {
            font-size: clamp(0.65rem, 1.5vw, 0.8rem);
            color: var(--text-secondary);
            word-break: break-word;
            line-height: 1.4;
        }

        .event-actions {
            display: flex;
            gap: 5px;
        }

        .event-action-btn {
            background: none;
            border: 1px solid #333;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 8px;
            font-size: 0.6rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            transition: all 0.15s;
            min-height: 26px;
        }

        .event-action-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .no-data {
            color: var(--text-muted);
            text-align: center;
            margin-top: 40px;
            font-size: 0.75rem;
        }

        .add-event-section {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .handoff-section {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
        }

        .handoff-item {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .handoff-item:hover {
            border-color: var(--accent-color);
        }

        .handoff-title {
            color: var(--text-primary);
            font-weight: bold;
        }

        .handoff-meta {
            color: var(--text-muted);
            margin: 4px 0;
        }

        .handoff-prompt {
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .handoff-actions {
            display: flex;
            gap: 6px;
        }

        .btn {
            background: #000;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: clamp(10px, 2vw, 14px) clamp(15px, 3vw, 20px);
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            width: 100%;
            min-height: var(--touch-min);
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            letter-spacing: 1px;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn.primary {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            background: #111;
            border: 2px solid var(--accent-color);
            padding: clamp(20px, 4vw, 40px);
            box-shadow: 0 0 50px rgba(255, 59, 48, 0.2);
            transform: scale(0.95);
            transition: transform 0.25s;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-family: var(--font-display);
            color: var(--accent-color);
            margin-bottom: 20px;
            font-size: var(--fs-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: clamp(10px, 2vw, 14px);
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-mono);
            font-size: clamp(0.75rem, 1.8vw, 0.95rem);
            outline: none;
            transition: border-color 0.15s;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent-color);
        }

        /* Checkboxes lose their native tick when appearance:none is applied to all
           inputs; without an explicit :checked paint the box looks dead when toggled.
           (BUGFIX: AGENT HANDOFF toggle appeared unresponsive.) */
        .form-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            min-height: 0;
            padding: 0;
            background: transparent;
            border: 2px solid var(--border-color);
            cursor: pointer;
            position: relative;
        }

        .form-group input[type="checkbox"]:checked {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .form-group input[type="checkbox"]:checked::after {
            content: "\2713";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .cat-select-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }

        .cat-option {
            padding: 8px;
            border: 2px solid var(--border-color);
            background: #000;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: center;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.15s;
            border-radius: 0;
            min-height: var(--touch-min);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .cat-option .dot {
            width: 8px;
            height: 8px;
        }

        .cat-option.selected {
            border-color: var(--cat-color, #fff);
            color: #fff;
            background: var(--bg-elevated);
        }

        /* ===== MOBILE DRAWER ===== */
        .drawer-toggle {
            display: none;
            position: fixed;
            bottom: calc(15px + var(--safe-bottom));
            right: 15px;
            width: 56px;
            height: 56px;
            background: var(--accent-color);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 500;
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.4);
            transition: transform 0.25s;
            align-items: center;
                       justify-content: center;
        }

        .drawer-toggle:active {
            transform: scale(0.9);
        }

        .mobile-drawer-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 599;
            opacity: 0;
            transition: opacity 0.25s;
            /* BUGFIX: hidden backdrop must never intercept clicks.
               At viewport widths <= 1000px (canvas panel / floating window)
               this element is display:block but opacity:0 — without
               pointer-events:none it shields the entire UI from the mouse. */
            pointer-events: none;
        }

        .mobile-drawer-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: 100%;
            max-width: 400px;
            padding: 0 15px;
        }

        .toast {
            background: var(--bg-elevated);
            border: 2px solid var(--accent-color);
            padding: 12px 20px;
            font-size: clamp(0.7rem, 1.5vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: toastIn 0.3s ease-out;
            text-align: center;
        }

        .toast.success { border-color: var(--cat-personal); }
        .toast.warning { border-color: var(--cat-urgent); }
        .toast.error { border-color: var(--cat-health); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== FIX: toast action + visible focus ===== */
        .toast {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .toast-action {
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
            font: inherit;
            font-size: 0.75em;
            letter-spacing: 1px;
            padding: 3px 10px;
            cursor: pointer;
            pointer-events: auto;
        }
        .toast-action:hover { background: rgba(255,255,255,0.1); }
        button:focus-visible,
        [tabindex]:focus-visible,
        [role="radio"]:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 1001px) {
            header {
                flex-wrap: nowrap;
            }
            .header-center {
                order: 2;
                width: auto;
            }
            .sys-info {
                display: block;
            }
        }

        @media (max-width: 1000px) {
            main {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 75vh;
                height: 75dvh;
                max-height: 620px;
                overscroll-behavior: contain;
                border-left: none;
                border-top: 2px solid var(--accent-color);
                z-index: 600;
                transform: translateY(100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                border-radius: 0;
                padding-bottom: calc(20px + var(--safe-bottom));
            }

            .sidebar.active {
                transform: translateY(0);
            }

            .drawer-toggle {
                display: flex;
            }

            .mobile-drawer-backdrop {
                display: block;
            }

            .brand {
                font-size: clamp(1.2rem, 5vw, 1.8rem);
                letter-spacing: 2px;
                padding-left: 10px;
                border-left-width: 3px;
            }

            .sys-info { display: none; }

            .calendar-view.month-view {
                grid-template-rows: auto repeat(6, minmax(56px, 1fr));
            }

            .day-cell {
                min-height: 56px;
                padding: 3px;
            }

            .event-marker {
                font-size: 0.58rem;
                padding: 1px 3px;
            }

            .view-toolbar {
                padding: 6px 10px;
                gap: 4px;
            }

            .view-toggle .icon-btn {
                min-height: 44px;
            }

            .cat-chip {
                min-height: 38px;
            }

            .cat-filter {
                gap: 3px;
            }

            .cat-chip {
                padding: 3px 5px;
                font-size: 0.5rem;
            }

            .modal {
                max-width: 100%;
                padding: 20px;
            }
        }

        @media (max-width: 600px) {
            /* Compact 2-row header: brand + actions / month nav.
               Replaces the wrapped 3-4 row flex header that ate the top
               of the screen on phones. */
            header {
                display: grid;
                grid-template-columns: 1fr auto;
                grid-template-areas:
                    "brand actions"
                    "nav nav";
                align-items: center;
                gap: 6px 8px;
                padding: 8px 12px;
            }

            .brand {
                grid-area: brand;
                font-size: 1.05rem;
                letter-spacing: 1.5px;
                padding-left: 8px;
                white-space: nowrap;
            }

            .header-right {
                grid-area: actions;
                gap: 4px;
            }

            .header-center {
                grid-area: nav;
                width: auto;
                min-width: 0;
            }

            .month-nav {
                width: 100%;
                gap: 6px;
            }

            #currentMonthDisplay {
                flex: 1;
                min-width: 0;
                font-size: 1.15rem;
                letter-spacing: 1px;
            }

            .header-right .icon-btn {
                padding: 8px 9px;
                font-size: 0.62rem;
                min-width: 40px;
            }

            .icon-btn {
                min-height: 44px;
            }

            .cat-filter {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 2px;
                -webkit-overflow-scrolling: touch;
            }

            .cat-chip {
                flex: 0 0 auto;
            }

            /* Taller, readable month cells */
            .calendar-view.month-view {
                grid-template-rows: auto repeat(6, minmax(64px, 1fr));
            }

            .day-cell {
                min-height: 64px;
            }

            .event-marker {
                font-size: 0.6rem;
            }

            .day-header {
                font-size: 0.55rem;
                padding: 5px 0;
                letter-spacing: 1px;
            }

            /* Week view: readable fixed-width columns with horizontal
               scrolling instead of 7 squeezed ~50px columns. */
            .calendar-view.week-view {
                grid-template-columns: repeat(7, minmax(150px, 1fr));
                touch-action: pan-x pan-y;
            }

            /* iOS Safari auto-zooms the page on input focus unless the
               input font-size is >= 16px. */
            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 16px;
            }

            /* Modal becomes a bottom sheet anchored to the viewport. */
            .modal-overlay {
                padding: 0;
                align-items: flex-end;
            }

            .modal {
                max-width: 100%;
                width: 100%;
                max-height: 92vh;
                max-height: 92dvh;
                border-width: 2px 2px 0 2px;
                border-radius: 12px 12px 0 0;
                padding: 16px 16px calc(16px + var(--safe-bottom));
                overscroll-behavior: contain;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .event-marker .event-time {
                display: none;
            }

            .event-action-btn {
                min-height: 36px;
                font-size: 0.65rem;
            }
        }

        @media (max-width: 400px) {
            .day-header {
                font-size: 0.55rem;
            }
            .day-number {
                font-size: 0.7rem;
                min-width: 20px;
                min-height: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container">

        <main>

            <div class="sidebar" id="sidebar">

    </div>

    <div class="mobile-drawer-backdrop" id="drawerBackdrop"></div>
    <button class="drawer-toggle" id="drawerToggle" aria-label="Toggle event panel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <!-- Modal -->
    <div class="modal-overlay" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <h2 id="modalTitle">// INPUT PARAMETERS</h2>
            <form id="eventForm">
                <input type="hidden" id="eventDateStr">
                <input type="hidden" id="eventEditIndex" value="-1">

                <div class="form-group">
                    <label>EVENT TITLE</label>

                <div class="form-group">

                <div class="form-group">
